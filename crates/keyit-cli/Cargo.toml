[package]
name = "keyit-cli"
description = "Keyit command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "keyit_cli"
path = "src/lib.rs"

[[bin]]
name = "keyit"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
keyit-protocol = { path = "../keyit-protocol" }
keyit-relay = { path = "../keyit-relay" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
# TOML for `.keyit/` local project metadata files. This is CLI-local
# storage tooling, not the protocol's canonical signed encoding.
toml = "1"
serde = { version = "1", features = ["derive"] }
# Lowercase hex encoding for byte-valued fields in local TOML metadata.
data-encoding = "2"
# Fills OS-random bytes for `ProjectGenesis::genesis_nonce`.
getrandom = "0.4"
# Safely zeroes transient buffers that briefly hold the local device's
# raw Ed25519 signing seed on generate and reload.
zeroize = "1"
# Blocking HTTP/TLS transport for hosted relay use. The protocol-level
# authentication remains Keyit's signed relay envelope; TLS is transport
# privacy/integrity for public HTTPS endpoints such as relay.keyit.sh.
ureq = "2"

[dev-dependencies]
# Isolated temporary directories for filesystem tests.
tempfile = "3"
# Re-declared here with `test-util` enabled so this crate's own tests can
# use `keyit-protocol`'s `new_unchecked_for_test` placeholder
# constructors.
keyit-protocol = { path = "../keyit-protocol", features = ["test-util"] }
