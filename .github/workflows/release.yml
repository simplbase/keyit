name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build binaries
        shell: bash
        run: cargo build --workspace --bins --release --locked --target "${{ matrix.target }}"

      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          asset="keyit-${version}-${{ matrix.target }}"
          package_dir="dist/${asset}"
          mkdir -p "${package_dir}"

          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/keyit.exe" "${package_dir}/"
            cp "target/${{ matrix.target }}/release/keyit-relay.exe" "${package_dir}/"
          else
            cp "target/${{ matrix.target }}/release/keyit" "${package_dir}/"
            cp "target/${{ matrix.target }}/release/keyit-relay" "${package_dir}/"
          fi

          cp README.md LICENSE "${package_dir}/"

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && 7z a "${asset}.zip" "${asset}")
          else
            tar -C dist -czf "dist/${asset}.tar.gz" "${asset}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: keyit-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 keyit-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "Keyit ${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
